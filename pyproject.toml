[tool.ruff]
target-version = "py312"
line-length = 100
# Scope checks to new tooling and extracted boundaries; pipeline bytes are compatibility inputs.
include = [
  "scripts/check_docs.py",
  "scripts/run_tests.py",
  "tests/test_validation_tools.py",
  "frontend/service/http_server.py",
  "frontend/tests/test_http_server.py",
  "tests/test_search_progress.py",
  "scripts/doctor.py",
  "tests/test_doctor.py",
  "scripts/create_synthetic_job.py",
  "frontend/service/dev_server.py",
  "frontend/tests/test_dev_server.py",
  "tests/test_synthetic_job.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
